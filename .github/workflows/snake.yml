name: Generate Snake Animation

on:
  # Jalankan otomatis setiap 24 jam
  schedule:
    - cron: "0 0 * * *"
  
  # Izinkan untuk dijalankan secara manual melalui tab Actions
  workflow_dispatch:
  
  # Jalankan otomatis setiap kali ada push ke branch main atau master
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Generate animasi snake dari grafik kontribusi GitHub
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      # Push file SVG yang dihasilkan ke branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
